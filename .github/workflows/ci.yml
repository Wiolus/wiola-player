name: CI

on:
  # Nothing here builds prose, so a pull request that only writes it waits for nothing.
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
      - assets/**
      - LICENSE
      - .gitignore
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ./scripts/format-cpp.sh --check
      - run: ./scripts/format-cmake.sh --check

  test:
    name: test (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      # One sanitizer failing is not a reason to stop hearing from the others.
      fail-fast: false
      matrix:
        preset: [linux-debug, linux-asan, linux-tsan]
        include:
          # A race that needs a scheduler accident will not show up in one run of the suite.
          - preset: linux-tsan
            ctest_args: --repeat until-fail:3
    env:
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          name: ${{ matrix.preset }}
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} -j
      - run: ctest --preset ${{ matrix.preset }} ${{ matrix.ctest_args }}

  coverage:
    runs-on: ubuntu-24.04
    steps:
      # All of it, since what a pull request changed is measured against where it started.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: ./.github/actions/setup-build
        with:
          name: coverage
          build-dir: build-coverage
          packages: llvm-18
      - run: ./scripts/coverage.sh
        env:
          CXX: clang++-18
      # The numbers, on the run's own page.
      - run: |
          {
            echo '### Coverage'
            echo '```'
            cat build-coverage/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # What this pull request itself left untested, which a total is too blunt to show.
      - if: github.event_name == 'pull_request'
        run: |
          diff-cover build-coverage/coverage/coverage.lcov \
            --compare-branch "origin/${{ github.base_ref }}" \
            --format "markdown:diff-coverage.md"
          cat diff-coverage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build-coverage/coverage/html
      # Only from main: what a pull request measured is its own, and does not replace the report.
      # The report takes a path of its own, leaving the root for whatever is put there later.
      - if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p site/coverage
          cp -r build-coverage/coverage/html/. site/coverage/
          printf '<meta http-equiv="refresh" content="0; url=coverage/">\n' > site/index.html
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: coverage
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
