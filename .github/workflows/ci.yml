name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ./scripts/format-cpp.sh --check
      - run: ./scripts/format-cmake.sh --check

  test:
    name: test (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      # One sanitizer failing is not a reason to stop hearing from the others.
      fail-fast: false
      matrix:
        preset: [linux-debug, linux-asan, linux-tsan]
    env:
      CXX: clang++-18
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev ccache
      # What was fetched, which changes only when the pinned versions do. The build directories
      # beside these are configuration's own and are left to be made again.
      - uses: actions/cache@v4
        with:
          path: |
            build-*/_deps/*-src
            build-*/_deps/*-subbuild
          key: deps-${{ matrix.preset }}-${{ hashFiles('cmake/dependencies.cmake') }}
      # What was compiled last time. Keyed by commit so every run leaves one, and restored from
      # whichever of this preset's is newest.
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.preset }}-
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} -j
      - run: ctest --preset ${{ matrix.preset }}

  coverage:
    runs-on: ubuntu-24.04
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      # All of it, since what a pull request changed is measured against where it started.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev llvm-18 ccache
      - uses: actions/cache@v4
        with:
          path: |
            build-coverage/_deps/*-src
            build-coverage/_deps/*-subbuild
          key: deps-coverage-${{ hashFiles('cmake/dependencies.cmake') }}
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-coverage-${{ github.sha }}
          restore-keys: ccache-coverage-
      - run: ./scripts/coverage.sh
        env:
          CXX: clang++-18
      # The numbers, on the run's own page.
      - run: |
          {
            echo '### Coverage'
            echo '```'
            cat build-coverage/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # What this pull request itself left untested, which a total is too blunt to show.
      - if: github.event_name == 'pull_request'
        run: |
          diff-cover build-coverage/coverage/coverage.lcov \
            --compare-branch "origin/${{ github.base_ref }}" \
            --format "markdown:diff-coverage.md"
          cat diff-coverage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build-coverage/coverage/html
