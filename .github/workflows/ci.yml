name: CI

on:
  # Nothing here builds prose, so a pull request that only writes it waits for nothing.
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
      - assets/**
      - LICENSE
      - .gitignore
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ./scripts/format-cpp.sh --check
      - run: ./scripts/format-cmake.sh --check

  test:
    name: test (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      # One sanitizer failing is not a reason to stop hearing from the others.
      fail-fast: false
      matrix:
        preset: [linux-debug, linux-asan, linux-tsan]
    env:
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          name: ${{ matrix.preset }}
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} -j
      - run: ctest --preset ${{ matrix.preset }}

  coverage:
    runs-on: ubuntu-24.04
    steps:
      # All of it, since what a pull request changed is measured against where it started.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: ./.github/actions/setup-build
        with:
          name: coverage
          build-dir: build-coverage
          packages: llvm-18
      - run: ./scripts/coverage.sh
        env:
          CXX: clang++-18
      # The numbers, on the run's own page.
      - run: |
          {
            echo '### Coverage'
            echo '```'
            cat build-coverage/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # What this pull request itself left untested, which a total is too blunt to show.
      - if: github.event_name == 'pull_request'
        run: |
          diff-cover build-coverage/coverage/coverage.lcov \
            --compare-branch "origin/${{ github.base_ref }}" \
            --format "markdown:diff-coverage.md"
          cat diff-coverage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build-coverage/coverage/html
